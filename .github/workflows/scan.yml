name: Scan and publish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan-and-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scan markets
        run: python -m polybot.scanner

      - name: Render dashboard
        env:
          POLYBOT_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m polybot.render_static

      - name: Commit updated data
        run: |
          git config user.name "polybot-ci"
          git config user.email "actions@users.noreply.github.com"
          git add data/polybot.sqlite3 docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Automated scan $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      # Deploy via Actions rather than the legacy branch-based Pages
      # builder, which errored intermittently on trivial static HTML for
      # no discernible content reason. This path reports success/failure
      # directly in this workflow's own logs instead of a separate,
      # harder-to-observe subsystem -- important since nobody's watching
      # this for a month.
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
