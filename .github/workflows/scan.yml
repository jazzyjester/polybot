name: Scan and publish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# cancel-in-progress: true on purpose (learned the hard way 2026-08-07). A
# run that gets stuck in GitHub's own queue (seen during a real Actions
# outage -- runner pods stuck idle) sits in "waiting" with zero steps
# executed. With cancel-in-progress: false, every later scheduled run just
# queues up behind it forever -- nothing runs again until a human manually
# cancels the stuck one. With true, the next scheduled trigger (<=30 min
# later) simply supersedes it instead. Safe to cancel a "waiting" run since
# it hasn't done anything yet; a run already past the commit step won't
# normally still be alive 30 min later anyway.
concurrency:
  group: scan-and-publish
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scan markets
        run: python -m polybot.scanner

      - name: Render dashboard
        env:
          POLYBOT_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m polybot.render_static

      - name: Commit updated data
        run: |
          git config user.name "polybot-ci"
          git config user.email "actions@users.noreply.github.com"
          git add data/polybot.sqlite3
          git diff --cached --quiet && exit 0
          git commit -m "Automated scan $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i), rebasing onto latest main and retrying"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "::error::git push kept failing after 5 attempts"
          exit 1

      # Deploy via Actions rather than the legacy branch-based Pages
      # builder, which errored intermittently on trivial static HTML for
      # no discernible content reason. This path reports success/failure
      # directly in this workflow's own logs instead of a separate,
      # harder-to-observe subsystem -- important since nobody's watching
      # this for a month.
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
